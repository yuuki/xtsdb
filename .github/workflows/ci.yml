name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    name: test (${{ matrix.hot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hot: ["redis:8.10.3", "valkey/valkey:9.1.3"]
    services:
      redis:
        image: ${{ matrix.hot }}
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping || valkey-cli ping"
          --health-interval 5s --health-retries 20
      cassandra:
        image: cassandra:5.0.9
        ports: ["9042:9042"]
        env:
          MAX_HEAP_SIZE: 1G
          HEAP_NEWSIZE: 256M
        options: >-
          --health-cmd "cqlsh -e 'DESCRIBE KEYSPACES'"
          --health-interval 10s --health-timeout 10s
          --health-retries 30 --health-start-period 60s
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
        env:
          XTSDB_TEST_REDIS_ADDRS: 127.0.0.1:6379
          XTSDB_TEST_CASSANDRA_HOSTS: 127.0.0.1:9042

  test-redis-cluster:
    runs-on: ubuntu-latest
    services:
      cassandra:
        image: cassandra:5.0.9
        ports: ["9042:9042"]
        env:
          MAX_HEAP_SIZE: 1G
          HEAP_NEWSIZE: 256M
        options: >-
          --health-cmd "cqlsh -e 'DESCRIBE KEYSPACES'"
          --health-interval 10s --health-timeout 10s
          --health-retries 30 --health-start-period 60s
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Start a 3-node Redis Cluster
        run: |
          for p in 7001 7002 7003; do
            docker run -d --network host --name redis-$p redis:8.10.3 \
              redis-server --port $p --cluster-enabled yes --cluster-config-file nodes-$p.conf
          done
          sleep 2
          docker exec redis-7001 sh -c 'echo yes | redis-cli --cluster create 127.0.0.1:7001 127.0.0.1:7002 127.0.0.1:7003 --cluster-replicas 0'
          until docker exec redis-7001 redis-cli -p 7001 cluster info | grep -q 'cluster_state:ok'; do sleep 1; done
      - name: Test
        run: go test -race -count=1 ./internal/hot/ ./internal/app/
        env:
          XTSDB_TEST_REDIS_ADDRS: 127.0.0.1:7001,127.0.0.1:7002,127.0.0.1:7003
          XTSDB_TEST_REDIS_CLUSTER: "1"
          XTSDB_TEST_CASSANDRA_HOSTS: 127.0.0.1:9042

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.sha }}
            REVISION=${{ github.sha }}
