name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-rc.N) publishes:
# - a GitHub release with binaries for Linux and macOS (amd64, arm64),
#   checksums, and the CHANGELOG.md section of the version as notes;
# - then, only if the release was created, the container image
#   ghcr.io/yuuki/xtsdb for linux/amd64 and linux/arm64, tagged X.Y.Z, X.Y
#   and X (and latest for releases that are not pre-releases).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # No build cache in release jobs: a cache written by another workflow
      # could poison the published artifacts.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Unit tests
        run: go test -race ./...
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/release-notes.sh "$version" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md

  binaries:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release
    steps:
      # GoReleaser publishes through the API with GITHUB_TOKEN, not with git.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Outside the checkout: GoReleaser refuses a dirty working tree.
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/notes/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The pushed tag, even if another tag points at the same commit
          # (for example a release candidate that is promoted).
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

  image:
    # After the release: a failed release must not leave a published image.
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
