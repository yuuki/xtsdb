# TiKV settings for storage.backend: tikv, used by compose.yaml (profile
# tikv) and CI. xtsdb needs RawKV entries with TTLs: API v2 (api_version: v2,
# the default), or API v1 with TTLs enabled (api_version: v1ttl).
[storage]
api-version = 2
enable-ttl = true
# A single development node: no disk space reserved, a small cache.
reserve-space = "0MB"

[storage.block-cache]
capacity = "512MB"
