\* expect: pass
\* The hand-off as implemented, with failovers to a lagging replica on a node whose clock is behind: completion fenced by content keeps every sample.
SPECIFICATION Spec
CONSTANTS
    Flushers = {f1, f2}
    Samples = {s1, s2, s3}
    Due = 2
    Lease = 1
    MaxTime = 4
    MaxStepBack = 1
    MaxClockSteps = 0
    MaxFailovers = 1
    CompleteFence = "content"
    HotFirst = TRUE
    ColdQuorum = TRUE
    Compaction = TRUE
    KeepShardClock = FALSE
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    NoUnpersistedDelete
    NoAckedSampleLost
    NoStrandedChunk
    ReadsComplete
PROPERTIES
    DueWindowImmutable
