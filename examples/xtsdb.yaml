# Example xtsdb configuration, used by the container image.
#
# Every field is optional. Values are the defaults, except where a comment
# says "example". Run `xtsdb config -config.file=<file> -config.expand-env`
# to print the effective configuration.
#
# Start xtsdb with -config.expand-env to replace ${VAR}, ${VAR:-default} and
# ${VAR-default} with environment variables ("$$" is a literal "$").
# Expansion is textual and happens before YAML parsing: the unquoted lists
# below accept comma separated values such as "redis-0:6379, redis-1:6379",
# and values that may contain YAML syntax (passwords) should be quoted.

server:
  http_listen_address: ":9201"
  graceful_shutdown_timeout: 30s
  enable_pprof: false
  # HTTPS. Empty cert_file (the default) serves plain HTTP. The certificate
  # is reloaded when its files change.
  tls:
    cert_file: ""
    key_file: ""
    client_ca_file: ""     # verify client certificates (mutual TLS)
    client_auth_type: ""   # RequireAndVerifyClientCert (default) or VerifyClientCertIfGiven
  # Credentials per scope; a scope without credentials is open, and
  # /-/healthy and /-/ready are always open. Example:
  #   write:
  #     basic_auth: [{username: prometheus, password: "${XTSDB_WRITE_PASSWORD}"}]
  #   read:
  #     bearer_tokens: ["${XTSDB_READ_TOKEN}"]
  auth:
    write: {}   # /api/v1/write
    read: {}    # query API, /metrics and /debug/pprof

log:
  level: info      # debug, info, warn, error
  format: logfmt   # logfmt, json

# In-memory tier (Redis >= 7.0 or Valkey >= 7.2). One address: standalone.
# Several addresses or cluster_mode: Redis Cluster. master_name: Sentinel.
redis:
  addrs: [${XTSDB_REDIS_ADDRS:-127.0.0.1:6379}]  # example: from the environment
  cluster_mode: false
  master_name: ""
  username: ""
  password: "${XTSDB_REDIS_PASSWORD:-}"          # example: from the environment
  db: 0
  pool_size: 0     # 0: go-redis default (10 per CPU)
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  tls:
    enabled: false

# Persistent tier and series index on Cassandra (or ScyllaDB), used with
# storage.backend: cassandra.
cassandra:
  hosts: [${XTSDB_CASSANDRA_HOSTS:-127.0.0.1:9042}]  # example: from the environment
  keyspace: xtsdb
  local_dc: ""
  # Reads and writes use this level. With replication, use LOCAL_QUORUM (or
  # QUORUM) so that queries always see chunks the flusher has written.
  consistency: LOCAL_QUORUM
  username: ""
  password: "${XTSDB_CASSANDRA_PASSWORD:-}"     # example: from the environment
  timeout: 10s
  connect_timeout: 10s
  num_conns: 2
  # example (default false): create the keyspace and tables on startup.
  # In production run `xtsdb migrate` with a NetworkTopologyStrategy instead.
  auto_migrate: true
  replication_class: SimpleStrategy   # or NetworkTopologyStrategy
  replication_factor: 1
  # datacenters: {dc1: 3, dc2: 3}     # for NetworkTopologyStrategy

# Persistent tier and series index on TiKV (RawKV), used with
# storage.backend: tikv. Entries expire through TTLs: with api_version
# v1ttl, TiKV must run with storage.api-version = 1 and
# storage.enable-ttl = true (see deploy/tikv.toml); with v2, with
# api-version = 2, and expired entries are removed from disk only below the
# GC safe point, which TiDB or a RawKV GC worker must advance (and
# storage.enable-ttl = true too). Keys start with storage.key_prefix. There
# is no schema to create.
tikv:
  pd_endpoints: [${XTSDB_TIKV_PD_ENDPOINTS:-127.0.0.1:2379}]  # example: from the environment
  api_version: v1ttl   # or v2
  keyspace: ""         # API v2 keyspace; empty: the default keyspace
  timeout: 10s      # per request, retries included
  connect_timeout: 10s
  # TLS to PD and TiKV: ca_file, cert_file and key_file are all required
  # (the PD client uses TLS only with a client certificate).
  tls:
    enabled: false

# Storage layout. key_prefix, shards, chunk_range and index_buckets must not
# change once data exists; xtsdb refuses to start if shards or chunk_range
# differ from the values recorded in Redis, or chunk_range and index_buckets
# from the values recorded in the persistent tier.
storage:
  backend: ${XTSDB_STORAGE_BACKEND:-cassandra}   # example: from the environment; cassandra or tikv
  key_prefix: xt       # of Redis keys, and of TiKV keys with the tikv backend
  shards: 256
  # Samples are grouped per series into windows of chunk_range. A window
  # accepts samples until chunk_range + grace_period after its start; then
  # it is flushed to the persistent tier. Later samples for it are rejected.
  chunk_range: 1h
  grace_period: 10m
  retention: 90d   # 0 keeps data forever (max 20y minus 2d)
  # The series of a label pair (and the values of a label) are spread over
  # this many Cassandra partitions per day, so that a pair shared by
  # millions of series does not make one huge partition. Every index lookup
  # reads all of them in parallel. 1 disables bucketing. Cassandra only:
  # TiKV splits large ranges by itself.
  index_buckets: 16

ingester:
  # Graphite plaintext protocol over TCP and UDP; empty (the default)
  # disables it.
  graphite_listen_address: ":2003"   # example
  graphite_max_connections: 1024
  # Graphite over TLS on TCP (same fields as server.tls); UDP is then
  # disabled. Use client_ca_file to authenticate senders.
  graphite_tls:
    cert_file: ""
    key_file: ""
  # Remote write limits. Protobuf decoding inflates requests, so the number
  # of elements is checked before decoding.
  max_request_body_size: 10485760    # compressed bytes
  max_decompressed_size: 33554432
  max_series_per_request: 100000
  max_samples_per_request: 1000000
  max_inflight_requests: 16          # more concurrent requests get 503
  max_sample_future: 10m
  index_cache_size: 2000000
  index_write_concurrency: 64

flusher:
  poll_interval: 1s
  batch_size: 128
  concurrency: 8
  lease_duration: 2m
  # Undecodable chunks are moved to a quarantine key instead of blocking
  # flushing, and kept this long for inspection (`xtsdb quarantine list`).
  # 0 keeps them until they are deleted (`xtsdb quarantine delete`).
  quarantine_ttl: 30d

querier:
  lookback_delta: 5m
  timeout: 2m
  max_samples: 50000000
  max_series_per_query: 100000
  max_concurrent_queries: 20
  # How far back queries may reach when storage.retention is 0; 0 means 1y.
  max_query_lookback: 0s
  # Minimum span read from Redis; must be at least chunk_range +
  # grace_period. Chunks that are older but not flushed yet are found
  # automatically.
  hot_lookback: 6h
  series_cache_size: 1000000
  read_concurrency: 64
