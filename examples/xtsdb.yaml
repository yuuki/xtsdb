# Example xtsdb configuration. Every field is optional; the values below are
# the defaults unless noted. Run `xtsdb config -config.file=<file>` to print
# the effective configuration. With -config.expand-env, ${VAR} references are
# replaced by environment variables.

server:
  http_listen_address: ":9201"
  graceful_shutdown_timeout: 30s
  enable_pprof: false

log:
  level: info      # debug, info, warn, error
  format: logfmt   # logfmt, json

# In-memory tier. One address: standalone. Several addresses or
# cluster_mode: Redis Cluster. master_name: Redis Sentinel.
# Valkey works as a drop-in replacement.
redis:
  addrs: ["${XTSDB_REDIS_ADDR:-127.0.0.1:6379}"]
  cluster_mode: false
  master_name: ""
  username: ""
  password: ""
  db: 0
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  tls:
    enabled: false

# Persistent tier and series index.
cassandra:
  hosts: ["${XTSDB_CASSANDRA_HOSTS:-127.0.0.1:9042}"]
  keyspace: xtsdb
  local_dc: ""
  consistency: LOCAL_QUORUM
  timeout: 10s
  connect_timeout: 10s
  num_conns: 2
  # Create the keyspace and tables on startup (default false). In production
  # run `xtsdb migrate` instead.
  auto_migrate: true
  replication_class: SimpleStrategy   # or NetworkTopologyStrategy
  replication_factor: 1
  # datacenters: {dc1: 3, dc2: 3}     # for NetworkTopologyStrategy

# Storage layout. key_prefix and shards must not change once data exists.
storage:
  key_prefix: xt
  shards: 256
  # Samples are grouped per series into windows of chunk_range. A window
  # accepts samples until chunk_range + grace_period after its start; then
  # it is flushed to Cassandra. Later samples for it are rejected.
  chunk_range: 1h
  grace_period: 10m
  retention: 90d   # 0 keeps data forever (max 20y)

ingester:
  # Graphite plaintext protocol over TCP and UDP; empty disables it.
  graphite_listen_address: ":2003"
  max_request_body_size: 33554432
  max_sample_future: 10m
  index_cache_size: 2000000
  index_write_concurrency: 64

flusher:
  poll_interval: 1s
  batch_size: 128
  concurrency: 8
  lease_duration: 2m

querier:
  lookback_delta: 5m
  timeout: 2m
  max_samples: 50000000
  max_series_per_query: 100000
  # How far back the querier reads Redis. Must cover chunk_range +
  # grace_period plus the expected flush lag.
  hot_lookback: 6h
  series_cache_size: 1000000
  read_concurrency: 64
